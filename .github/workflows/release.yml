# Generated: publishes the package when a tag v* is pushed and its tests pass. Do not edit, the next release replaces it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version of the package
        run: test "$GITHUB_REF_NAME" = "v2.3.0" || { echo "tag $GITHUB_REF_NAME, package v2.3.0"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish --access public
